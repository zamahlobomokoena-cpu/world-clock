<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>World Clock - Wandile Mokoena</title>
</head>
<body>
    <div class="container">
        <h1> World Clock</h1>

        <select>
            <option value="">Select a city...</option>
            <option value="">London</option>
            <option value="">New York</option>
            <option value="">Brimingham</option>
            <option value="">Auckland</option>
            <option value="">Brussels</option>
        </select>
        
        <div class="city"></div>
            <div>
                <h2>London</h2>
                <div class="date"> November 6th 2025</div>
            </div>    
            <div class="time"> 18:08:25 <small> PM </small></div>
        <div class="city"></div>
            <div>
                <h2>New York</h2>
                <div class="date"> November 6th 2025</div>
            </div>    
            <div class="time"> 13:10:25 <small> PM </small></div>
         </div>
    
        <footer> This project was coded by <strong>Wandile Mokoena</strong> and is <a href="https://github.com/zamahlobomokoena-cpu/world-clock" target="_blank"> open sourced on Github</a>.</footer>
    <script src="javascript/index.js"></script>
</body>
</html>
